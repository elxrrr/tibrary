[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidal-library-manager"
version = "1.0.0rc1"
description = "Local music catalogue, reviewed library maintenance and approved acquisition"
requires-python = ">=3.12"
dependencies = ["tibrary-tags==0.2.1", "keyring>=25.6,<26", "soundfile>=0.13,<0.14", "Pillow>=11,<13", "imageio-ffmpeg>=0.6,<1", "Send2Trash>=1.8,<2"]

[project.scripts]
tidal-library-manager = "library_manager.sidecar:main"

[tool.setuptools.packages.find]
include = ["library_manager*"]

[tool.setuptools.package-data]
library_manager = ["assets/*.svg"]
