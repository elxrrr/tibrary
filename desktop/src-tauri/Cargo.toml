[package]
name = "tibrary"
version = "0.9.0-beta.18"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "macros", "fs"] }
url = "2"
turso = "0.8.0-pre.12"
lofty = "=0.25.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
claxon = "0.4"
aes = "0.8"
cbc = "0.1"
ctr = "0.9"
cipher = "0.4"
sha2 = "0.10"
rand = "0.8"
quick-xml = "0.37"
unicode-normalization = "0.1"
